<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="title desc">
  <title id="title">Green Basket GBG</title>
  <desc id="desc">Connected GBG monogram representing growth, partnership and progress.</desc>
  <defs>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#075c3d"/>
      <stop offset="0.55" stop-color="#109447"/>
      <stop offset="1" stop-color="#78cf19"/>
    </linearGradient>
    <linearGradient id="lime" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#42a914"/>
      <stop offset="1" stop-color="#a1df20"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb000"/>
      <stop offset="1" stop-color="#ff6500"/>
    </linearGradient>
  </defs>
  <rect width="900" height="300" rx="42" fill="#ffffff"/>
  <!-- Connected GBG monogram: three linked letterforms, no basket -->
  <g transform="translate(35 38)" stroke-linecap="round" stroke-linejoin="round">
    <!-- G -->
    <path d="M205 34H112C62 34 34 64 34 112s28 78 78 78h93v-65h-73" fill="none" stroke="url(#green)" stroke-width="38"/>
    <!-- B, interlocked with G -->
    <path d="M198 34v156h72c40 0 62-20 62-50 0-23-12-39-34-46 18-8 27-22 27-42 0-20-17-18-55-18z" fill="none" stroke="url(#green)" stroke-width="38"/>
    <path d="M198 112h65" stroke="#ffffff" stroke-width="12"/>
    <!-- G, linked directly into B -->
    <path d="M515 34h-74c-50 0-78 30-78 78s28 78 78 78h77v-60h-62" fill="none" stroke="url(#lime)" stroke-width="38"/>
    <!-- Connection bridges -->
    <path d="M276 112C321 88 347 82 386 88" fill="none" stroke="url(#green)" stroke-width="20"/>
    <path d="M350 150C394 174 431 178 475 165" fill="none" stroke="url(#green)" stroke-width="20"/>
    <!-- Growth leaf integrated into first G -->
    <path d="M73 155c8-36 31-57 65-69-3 29-20 55-55 72z" fill="url(#lime)" stroke="none"/>
    <path d="M79 151c18-20 35-35 55-48" fill="none" stroke="#ffffff" stroke-width="5" opacity=".9"/>
    <!-- Progress accent -->
    <path d="M475 190c27 2 53-5 74-22-7 22-20 40-43 50z" fill="url(#orange)" stroke="none"/>
  </g>
  <text x="610" y="228" text-anchor="middle" font-family="Arial,sans-serif" font-size="62" font-weight="800" letter-spacing="-2" fill="#075c3d">Green <tspan fill="#55b719">Basket</tspan></text>
  <text x="610" y="263" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="6" fill="#53615a">ALL YOUR BUSINESS NEEDS, ONE PLACE</text>
</svg>
