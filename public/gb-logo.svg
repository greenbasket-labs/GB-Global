<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="title desc">
  <title id="title">Green Basket Global Limited</title>
  <desc id="desc">Three green leaves representing growth, connection and progress.</desc>
  <defs>
    <linearGradient id="leafDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#008f3f"/>
      <stop offset="1" stop-color="#00533d"/>
    </linearGradient>
    <linearGradient id="leafGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#68c82d"/>
      <stop offset="1" stop-color="#07934a"/>
    </linearGradient>
    <linearGradient id="leafLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9cdb62"/>
      <stop offset="1" stop-color="#45ad4d"/>
    </linearGradient>
  </defs>
  <rect width="900" height="300" rx="42" fill="#ffffff"/>
  <g transform="translate(45 25)">
    <!-- Left leaf -->
    <path d="M115 25C57 26 22 58 24 111c2 58 38 92 104 104 13-64 2-130-13-190z" fill="url(#leafGreen)"/>
    <path d="M31 39c34 29 67 61 94 101" fill="none" stroke="#74d03a" stroke-width="5" stroke-linecap="round" opacity=".9"/>
    <!-- Upper-right leaf -->
    <path d="M225 0C165 10 130 48 129 104c-1 38 10 72 31 98 47-27 77-73 88-126 7-33 6-57-23-76z" fill="url(#leafDark)"/>
    <path d="M151 179c25-43 50-78 79-111" fill="none" stroke="#78cf32" stroke-width="5" stroke-linecap="round"/>
    <!-- Lower leaf -->
    <path d="M96 218c38 19 87 17 132-9 39-23 64-58 76-104-48 13-89 33-122 60-30 24-55 44-86 53z" fill="url(#leafLight)"/>
  </g>
  <text x="595" y="122" text-anchor="middle" font-family="Arial,sans-serif" font-size="64" font-weight="800" letter-spacing="-2" fill="#075c3d">Green Basket</text>
  <text x="595" y="165" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" font-weight="500" letter-spacing="9" fill="#075c3d">GLOBAL LIMITED</text>
  <text x="595" y="205" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="500" fill="#53615a">Practical technology. One place. Built to grow.</text>
</svg>
